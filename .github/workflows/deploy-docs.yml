name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the test tools
        run: pip3 install --require-hashes -r tests/requirements.txt

      - name: Check the workflow rules
        run: python3 -m pytest -q tests

  build:
    # Pull requests from forks get no secrets, so they cannot fetch the theme.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # No ssh-key and no submodules here: actions/checkout would fetch this
      # repository with the brand deploy key too, which is not valid for it.
      # Full history, so git-revision-date-localized dates every page right.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the brand pin
        id: brand
        run: echo "sha=$(git rev-parse HEAD:brand)" >> "$GITHUB_OUTPUT"

      - name: Fetch the brand theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qubernetic/brand
          ref: ${{ steps.brand.outputs.sha }}
          path: brand
          ssh-key: ${{ secrets.BRAND_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install MkDocs Material
        run: pip3 install --require-hashes -r requirements.txt

      - name: Build
        run: python3 -m mkdocs build --strict -d "$GITHUB_WORKSPACE/_site"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload the rehearsal build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: _site

  deploy:
    needs: [build, rules]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
