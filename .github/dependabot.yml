# Weekly update pull requests into develop. Their build job fetches the brand
# theme with the Dependabot secret BRAND_DEPLOY_KEY, a deploy key of its own.
# The brand submodule is not listed: it moves by hand, with the theme.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: ["/", "/tests"]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Stays at the version the brand theme is built for.
      - dependency-name: mkdocs-material
